name: Deploy production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy main to production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out deployed revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate deployment secrets
        env:
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
          PROD_ACCESS_CLIENT_ID: ${{ secrets.PROD_ACCESS_CLIENT_ID }}
          PROD_ACCESS_CLIENT_SECRET: ${{ secrets.PROD_ACCESS_CLIENT_SECRET }}        
        run: |
          set -eu
          echo "$PROD_SSH_USER  \n"
          echo "$PROD_SSH_KNOWN_HOSTS  \n"
          echo "$PROD_ACCESS_CLIENT_ID  \n"
          echo "$PROD_ACCESS_CLIENT_SECRET"
          
          if [ -z "$PROD_SSH_USER" ] || \
             [ -z "$PROD_SSH_PRIVATE_KEY" ] || \
             [ -z "$PROD_SSH_KNOWN_HOSTS" ] || \
             [ -z "$PROD_ACCESS_CLIENT_ID" ] || \
             [ -z "$PROD_ACCESS_CLIENT_SECRET" ]; then
            echo "::error::Configure PROD_SSH_USER, PROD_SSH_PRIVATE_KEY, PROD_SSH_KNOWN_HOSTS, PROD_ACCESS_CLIENT_ID, and PROD_ACCESS_CLIENT_SECRET in the production environment"
            exit 1
          fi

      - name: Install cloudflared
        run: |
          set -eu
          sudo install -d -m 0755 /usr/share/keyrings
          curl -fsSL https://pkg.cloudflare.com/cloudflare-main.gpg \
            | sudo tee /usr/share/keyrings/cloudflare-main.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main' \
            | sudo tee /etc/apt/sources.list.d/cloudflared.list >/dev/null
          sudo apt-get update
          sudo apt-get install --yes cloudflared

      - name: Prepare SSH and repository bundle
        env:
          PROD_SSH_PRIVATE_KEY: ${{ secrets.PROD_SSH_PRIVATE_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          set -eu
          install -m 700 -d "$RUNNER_TEMP/deploy-ssh"
          printf '%s\n' "$PROD_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/deploy-ssh/id"
          printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/deploy-ssh/known_hosts"
          chmod 600 "$RUNNER_TEMP/deploy-ssh/id" "$RUNNER_TEMP/deploy-ssh/known_hosts"
          git bundle create "$RUNNER_TEMP/repository.bundle" main

      - name: Deploy main to production directory
        env:
          PROD_SSH_HOST: git-hub.hoppynet.co.uk
          PROD_SSH_USER: ${{ secrets.PROD_SSH_USER }}
          PROD_ACCESS_CLIENT_ID: ${{ secrets.PROD_ACCESS_CLIENT_ID }}
          PROD_ACCESS_CLIENT_SECRET: ${{ secrets.PROD_ACCESS_CLIENT_SECRET }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_options=(
            -i "$RUNNER_TEMP/deploy-ssh/id"
            -o BatchMode=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$RUNNER_TEMP/deploy-ssh/known_hosts"
            -o "HostKeyAlias=$PROD_SSH_HOST"
          )
          bundle_path="/tmp/local-ai-agent-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.bundle"
          cloudflared_log="$RUNNER_TEMP/cloudflared-access.log"

          cloudflared access tcp \
            --hostname "$PROD_SSH_HOST" \
            --url 127.0.0.1:2222 \
            --service-token-id "$PROD_ACCESS_CLIENT_ID" \
            --service-token-secret "$PROD_ACCESS_CLIENT_SECRET" \
            >"$cloudflared_log" 2>&1 &
          cloudflared_pid=$!
          cleanup() {
            kill "$cloudflared_pid" 2>/dev/null || true
            wait "$cloudflared_pid" 2>/dev/null || true
            rm -f "$RUNNER_TEMP/deploy-ssh/id" \
              "$RUNNER_TEMP/deploy-ssh/known_hosts" \
              "$RUNNER_TEMP/repository.bundle" \
              "$cloudflared_log"
          }
          trap cleanup EXIT

          proxy_ready=false
          for attempt in {1..30}; do
            if ! kill -0 "$cloudflared_pid" 2>/dev/null; then
              echo "::error::Cloudflare Access TCP proxy exited before becoming ready"
              exit 1
            fi
            if timeout 2 bash -c 'exec 3<>/dev/tcp/127.0.0.1/2222' 2>/dev/null; then
              proxy_ready=true
              break
            fi
            sleep 1
          done
          if [ "$proxy_ready" != true ]; then
            echo "::error::Cloudflare Access TCP proxy did not become ready"
            exit 1
          fi

          scp_options=("${ssh_options[@]}" -P 2222)
          destination="$PROD_SSH_USER@127.0.0.1"
          scp "${scp_options[@]}" "$RUNNER_TEMP/repository.bundle" "$destination:$bundle_path"
          ssh "${ssh_options[@]}" -p 2222 "$destination" bash -s -- "$bundle_path" <<'REMOTE'
          set -eu
          bundle_path=$1
          target=/opt/local_ai_agent_prod
          trap 'rm -f "$bundle_path"' EXIT

          if [ ! -d "$target/.git" ]; then
            if [ -n "$(find "$target" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
              echo "Production directory is not empty and is not a Git checkout: $target" >&2
              exit 1
            fi
            git clone --branch main "$bundle_path" "$target"
            git -C "$target" remote set-url origin https://github.com/hoppynethomelab/Local-AI-Agent-Architecture-.git
          else
            current_branch=$(git -C "$target" branch --show-current)
            if [ "$current_branch" != main ]; then
              echo "Production checkout is on '$current_branch', expected 'main'" >&2
              exit 1
            fi
            git -C "$target" fetch "$bundle_path" main
            git -C "$target" merge --ff-only FETCH_HEAD
          fi
          REMOTE
